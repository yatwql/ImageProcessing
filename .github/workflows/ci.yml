# CI 门禁 —— 与 `CLAUDE.md` 的约束一一对应
#
#   test       全量用例 × Python 3.10/3.12/3.13（阻塞）
#   lint       ruff check（阻塞）、ruff format 漂移（只报告，非阻塞）
#   typecheck  mypy 全树（阻塞）
#   guards     编号/分层/长度/编码/测试目录/版本/名称/依赖锁/PS编码/薄壳
#   perf       渲染与擦除的耗时守卫（阈值见 src/python/tools/check_perf.py）
#
# 本地等价命令：
#   .venv/bin/ruff check src/ scripts/
#   .venv/bin/python -m mypy
#   .venv/bin/python -m src.python.tools.check_guards
#   .venv/bin/python -m src.python.tools.check_perf
#   .venv/bin/python -m pytest src/test -q

name: CI

on:
  push:
    branches: [master, dev]   # master = 已发布，dev = 日常开发；旧 main 已改名
    tags: ["v*"]
  pull_request:
    branches: [master]

# 同一分支连续推送时取消旧 run：runner 不排队空跑，失败反馈也不会被新提交掩盖。
# 标签构建不取消（发布不能被打断）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # constraints.txt 锁住已验证的版本组合，
      # 避免大版本漂移悄悄改变像素结果
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"

      # runner 默认没有中文字体：合成图与字体匹配用例会整批 skip
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 全量用例 + 覆盖率（并行分片）
        env:
          IMG_P_TMP_DIR: ${{ runner.temp }}/img-p
        run: |
          mkdir -p "$IMG_P_TMP_DIR"
          # 一条命令同时出 junit 与覆盖率：以前分两步跑两遍全量用例，
          # 等于把同一份 700+ 用例在同一个 runner 上跑两次（时间白花一倍）。
          # `-n 4` 对齐 GitHub 标准 runner 的 4 核（worker 策略见 tools/_parallel.py）。
          python -m pytest src/test -q -n 4 \
            --cov --cov-report=term \
            --cov-report=xml:"$IMG_P_TMP_DIR/coverage.xml" \
            --junitxml="$IMG_P_TMP_DIR/junit.xml"

      # 环境指纹：把解释器、平台、依赖版本、字体清单记下来，
      # 出"本机绿 CI 红"时能直接比对，而不是靠猜
      - name: 环境指纹
        if: always()
        run: python -m src.python.tools.ci_env ci-env

      - name: 上传报告与指纹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/img-p/junit.xml
            ${{ runner.temp }}/img-p/coverage.xml
            ci-env/
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"

      - name: ruff check（阻塞）
        run: python -m ruff check src/ scripts/

      # 格式属风格问题，不阻断合入：只报告需要重排的文件
      - name: ruff format 漂移（非阻塞）
        continue-on-error: true
        run: python -m ruff format --check src/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: mypy 全树
        run: python -m mypy

  guards:
    # 这些漂移不会让用例变红，只会让约束悄悄失效，故独立成作业
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: 工程守护
        run: python -m src.python.tools.check_guards

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: 渲染/擦除耗时守卫
        run: python -m src.python.tools.check_perf

  windows:
    # Windows 与 Linux 的差异点：curses 实现（windows-curses）与路径/编码，
    # 这里跑全量用例 + 类型 + 守护 + 耗时，避免"只在 Linux 绿"。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # 用 bash 跑安装：默认 PowerShell 不认反斜杠续行（报 Directory '\\' is not installable），
      # 指定 bash 后与 Ubuntu 作业写法一致，也顺带避开超长行。
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: 全量用例
        env:
          IMG_P_NO_AUTO_SETUP: "1"
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest src/test -q --junitxml=reports/junit-windows.xml
      # 失败时先给出"哪几条用例红"，不用翻整段日志（复盘模板要求一眼看到归类依据）。
      # 逻辑放在 src/python/tools/junit_summary.py：那里有 ensure_utf8_stdio()，
      # 不会像 shell heredoc 那样在 Windows 控制台（cp1252）上自己先红。
      - name: 失败用例摘要
        if: always()
        shell: bash
        run: python -m src.python.tools.junit_summary reports/junit-windows.xml
      - name: 上传 junit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-junit
          path: reports/junit-windows.xml
          if-no-files-found: ignore
      - name: 类型检查
        run: python -m mypy
      - name: 工程守护
        run: python -m src.python.tools.check_guards
      - name: 耗时守卫
        run: python -m src.python.tools.check_perf

  audit:
    # 依赖漏洞审计：装到当前环境的版本（就是 constraints.txt 锁的那套）逐个查 CVE。
    # 有中高危就红；纯粹"升级更香"的提示不算。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      # 审计冻结清单而不是当前环境：本地包（editable）不在 PyPI 上，
      # 直接审计环境会让 pip-audit 以 "distribution marked as editable" 报错退出。
      - name: pip-audit
        run: |
          python -m pip freeze | grep -v "^-e" > ci-audit-reqs.txt
          python -m pip_audit -r ci-audit-reqs.txt --strict \
            --progress-spinner off

  release:
    # 发布：推 v* 标签触发——全量门禁 → 构建 wheel/sdist → 建 GitHub Release。
    # 没有"跳过门禁直接发"的路径：check_all 红了就发不出去。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 发布门禁（全量）
        run: python -m src.python.tools.check_all
      - name: 构建产物
        run: |
          python -m pip install --quiet build
          python -m src.python.tools.release build
      - name: 建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
