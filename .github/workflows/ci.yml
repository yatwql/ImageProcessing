# CI 门禁 —— 与 `CLAUDE.md` 的约束一一对应
#
#   test       全量用例 × Python 3.10/3.12/3.13（阻塞）
#   lint       ruff check（阻塞）、ruff format 漂移（只报告，非阻塞）
#   typecheck  mypy 全树（阻塞）
#   guards     编号/分层/长度/编码/测试目录/版本/名称/依赖锁/PS编码/薄壳
#   perf       渲染与擦除的耗时守卫（阈值见 tools/check_perf.py）
#
# 本地等价命令：
#   .venv/bin/ruff check src/ scripts/
#   .venv/bin/python -m mypy
#   .venv/bin/python tools/check_guards.py
#   .venv/bin/python tools/check_perf.py
#   .venv/bin/python -m pytest src/test -q

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # constraints.txt 锁住已验证的版本组合，
      # 避免大版本漂移悄悄改变像素结果
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"

      # runner 默认没有中文字体：合成图与字体匹配用例会整批 skip
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 全量用例
        env:
          IMG_P_TMP_DIR: ${{ runner.temp }}/img-p
        run: |
          mkdir -p "$IMG_P_TMP_DIR"
          python -m pytest src/test -q \
            --junitxml="$IMG_P_TMP_DIR/junit.xml"

      - name: 覆盖率
        env:
          IMG_P_TMP_DIR: ${{ runner.temp }}/img-p
        run: |
          python -m pytest src/test -q --cov \
            --cov-report=term \
            --cov-report=xml:"$IMG_P_TMP_DIR/coverage.xml"

      # 环境指纹：把解释器、平台、依赖版本、字体清单记下来，
      # 出"本机绿 CI 红"时能直接比对，而不是靠猜
      - name: 环境指纹
        if: always()
        run: |
          mkdir -p ci-env
          python -VV > ci-env/python.txt 2>&1
          python -m pip freeze > ci-env/pip-freeze.txt 2>&1
          python -c "import platform, sys; print(platform.platform());
                     print(sys.platform)" > ci-env/platform.txt
          fc-list 2>/dev/null | head -50 > ci-env/fonts.txt ||
            echo "no fc-list" > ci-env/fonts.txt

      - name: 上传报告与指纹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/img-p/junit.xml
            ${{ runner.temp }}/img-p/coverage.xml
            ci-env/
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"

      - name: ruff check（阻塞）
        run: python -m ruff check src/ scripts/

      # 格式属风格问题，不阻断合入：只报告需要重排的文件
      - name: ruff format 漂移（非阻塞）
        continue-on-error: true
        run: python -m ruff format --check src/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: mypy 全树
        run: python -m mypy

  guards:
    # 这些漂移不会让用例变红，只会让约束悄悄失效，故独立成作业
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: 工程守护
        run: python tools/check_guards.py

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: 渲染/擦除耗时守卫
        run: python tools/check_perf.py

  windows:
    # Windows 与 Linux 的差异点：curses 实现（windows-curses）与路径/编码，
    # 这里跑全量用例 + 类型 + 守护 + 耗时，避免"只在 Linux 绿"。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # 用 bash 跑安装：默认 PowerShell 不认反斜杠续行（报 Directory '\\' is not installable），
      # 指定 bash 后与 Ubuntu 作业写法一致，也顺带避开超长行。
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: 全量用例
        env:
          IMG_P_NO_AUTO_SETUP: "1"
        run: python -m pytest src/test -q
      - name: 类型检查
        run: python -m mypy
      - name: 工程守护
        run: python tools/check_guards.py
      - name: 耗时守卫
        run: python tools/check_perf.py

  audit:
    # 依赖漏洞审计：装到当前环境的版本（就是 constraints.txt 锁的那套）逐个查 CVE。
    # 有中高危就红；纯粹"升级更香"的提示不算。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
      - name: pip-audit
        run: python -m pip_audit --strict --progress-spinner off

  release:
    # 发布：推 v* 标签触发——全量门禁 → 构建 wheel/sdist → 建 GitHub Release。
    # 没有"跳过门禁直接发"的路径：check_all 红了就发不出去。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 \
            -c constraints.txt -e ".[dev]"
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 发布门禁（全量）
        run: python tools/check_all.py
      - name: 构建产物
        run: |
          python -m pip install --quiet build
          python tools/release.py build
      - name: 建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
