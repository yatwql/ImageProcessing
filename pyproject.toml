[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retype"
dynamic = ["version"]
description = "PNG 文字替换：换掉指定文字，其余内容与排版一像素不动"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "rapidocr-onnxruntime>=1.2",
  "windows-curses; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "pytest-cov>=5.0",
  "pytest-html>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "hypothesis>=6.100",
  "pip-audit>=2.7",
  'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
retype = "src.python.cli.main:main"

# 版本号只在 src/python/__init__.py 里维护，打包时从这里读，避免两处不一致。
[tool.setuptools.dynamic]
version = { attr = "src.python.version.VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
# 开发工具不进发行包：它们依赖 CI/开发环境（bash、gh、pip-audit 等）
exclude = ["src.python.tools*"]

# ── 静态检查 ─────────────────────────────────────────────────────────
# 基线命令：ruff check --select E,F,B,I --ignore E501 src/
# 与 CLAUDE.md 一致：行宽不设限（中文文案与长字符串较多），其余照默认。
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 基线之外再收紧一档：SIM（可化简写法）、C4（推导式）、UP（pyupgrade）、RUF（ruff 自家规则）、
# ARG（未用参数）。RUF001/2/3 是"看起来像别的字母的字符"——中文注释与全角标点会大量误报，关掉。
select = ["E", "F", "B", "I", "SIM", "C4", "UP", "RUF", "ARG"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── 类型检查 ─────────────────────────────────────────────────────────
# 全树检查（core 严格注解、渠道/用例/脚本放宽，见下方 overrides）：
# 全绿才允许合入，避免"只有核心层被守"的假安全感。
[tool.mypy]
python_version = "3.10"
files = ["src"]   # 开发工具已移到 src/python/tools（随 src 一起检查）
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cv2.*", "numpy.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# 渠道层直接面对 curses / PIL 的动态接口，逐函数注解收益低、噪音大：
# 只要求 core 的全量注解（上面 disallow_untyped_defs），渠道层放宽。
[[tool.mypy.overrides]]
module = ["src.python.tui.*", "src.python.cli.*", "src.test.*", "scripts.*"]
disallow_untyped_defs = false

# ── 测试与覆盖率 ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["src/test"]
addopts = "-ra"   # 保留用例汇总行，失败时给出简要原因
markers = [
  "slow: 需要加载 OCR / 真实字体的较慢用例",
]
# 并行由开关控制而不是 default addopts：`-n` 只在门禁/测试入口里加
# （`_parallel.worker_count()` 统一算 worker 数），裸 `pytest` 保持单进程单档，
# 排障时看到的顺序就是源码顺序。

[tool.coverage.run]
source = ["src/python"]
# 开发工具（src/python/tools）由 CI 自身驱动，不纳入覆盖率统计
omit = ["src/python/tools/*"]
# 行 + 分支一起统计：只看行覆盖会漏掉"这个 if 的 else 从没走过"这类真缺口。
# 阈值按实测下调到实测值向下取整，见下方 fail_under。
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  # 入口薄壳：真正的逻辑在对应模块里，这两行只在 `python -m` 时执行
  "if __name__ == .__main__.:",
]
# 阈值取当前实测值向下取整（见 guards 守护与 CI）；只降不升说明退化。
# 注意：开分支覆盖后总量口径变严（实测 93.92%，分支漏 95 条），
# 与旧的"行覆盖 96%"不是同一个分母，别拿两个数字直接比。
fail_under = 93
